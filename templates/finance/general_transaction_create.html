{% extends 'base.html' %}
{% block title %}Buat General Transaction{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-plus-circle"></i> Buat General Transaction</h3>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">{{ field.label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Simpan & Buat Jurnal</button>
                <a href="{% url 'finance:general_transaction_list' %}" class="btn btn-secondary">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
