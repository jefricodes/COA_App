{% extends 'base.html' %}
{% block title %}Lupa Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="login-card card">
        <div class="card-header">
            <h3><i class="bi bi-key"></i> Lupa Password</h3>
            <p>Masukkan email Anda untuk mereset password</p>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_email" class="form-label fw-semibold">Alamat Email</label>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="email@perusahaan.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-envelope"></i> Kirim Link Reset
                </button>
            </form>
            <div class="divider"></div>
            <div class="text-center">
                <a href="{% url 'accounts:login' %}" class="text-muted text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Kembali ke Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
