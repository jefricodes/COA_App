{% extends 'base.html' %}
{% block title %}Password Berhasil Diubah{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="login-card card">
        <div class="card-header bg-success">
            <h3><i class="bi bi-check-circle-fill"></i> Berhasil!</h3>
        </div>
        <div class="card-body text-center py-5">
            <h4 class="mb-3">Password Anda telah berhasil diubah.</h4>
            <p class="text-muted mb-4">Silakan login menggunakan password baru Anda.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Login Sekarang
            </a>
        </div>
    </div>
</div>
{% endblock %}
